name: Build Packages & Publish Repository

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bootstrap/**'
      - 'scripts/**'
      - 'patches/**'
      - 'manifest/**'
      - '.github/workflows/build-packages.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'bootstrap/**'
      - 'scripts/**'
      - 'patches/**'
      - 'manifest/**'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build pacman Packages, Verify & Publish
    permissions:
      contents: write

    env:
      OVL0AD3R_DOMAIN: ${{ vars.OVL0AD3R_DOMAIN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build meson pkg-config \
            zstd curl ca-certificates tar xz-utils unzip \
            libarchive-tools libarchive-dev patchelf \
            autoconf automake libtool gettext libssl-dev \
            python3
          # autopoint 必须显式装: 它是独立包, gettext 不带、autoconf 也不 Recommends,
          # 而 aria2 的 git 树没有预生成 configure, autoreconf -fi 要靠它。
          # GitHub runner 镜像恰好预装了它, 掩盖了这个依赖 —— 换 runner 或在干净的
          # ubuntu 容器里构建就会在 aria2 上炸, 所以不能靠镜像的偶然内容。
          sudo apt-get install -y autopoint
          command -v autopoint

      - name: Install repo-add
        run: |
          sudo apt-get install -y pacman-package-manager
          command -v repo-add
          repo-add --help > /dev/null

      - name: Install libalpm for the verification gate
        run: |
          sudo apt-get install -y libalpm-dev
          printf '#include <alpm.h>\nint main(void){return alpm_version()?0:1;}\n' \
            > /tmp/alpm-probe.c
          cc -O2 -o /tmp/alpm-probe /tmp/alpm-probe.c -lalpm || \
            { echo "::error::libalpm不可用,门禁的libalpm段将无法运行(缺libarchive-dev?)"; exit 1; }
          /tmp/alpm-probe

      - name: Check Manifest Matches Arch Upstream
        run: |
          ./scripts/sync-archlinux.py --check

      - name: Refresh Manifest
        if: failure()
        continue-on-error: true
        run: ./scripts/sync-archlinux.py

      - name: Upload Refreshed Manifest Diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-manifest
          path: manifest/components.manifest
          retention-days: 7

      - name: Setup Android NDK
        run: |
          NDK_PIN=$(python3 scripts/manifest-query.py ndk version)
          test -n "$NDK_PIN" || { echo "::error::清单里没有ndk版本"; exit 1; }
          echo "按清单安装Android NDK $NDK_PIN"
          NDK_ZIP="android-ndk-${NDK_PIN}-linux.zip"
          curl -fsSL -o "/tmp/$NDK_ZIP" \
            "https://dl.google.com/android/repository/$NDK_ZIP"
          sudo unzip -q "/tmp/$NDK_ZIP" -d /opt
          sudo mv "/opt/android-ndk-${NDK_PIN}" /opt/android-ndk
          echo "ANDROID_NDK_ROOT=/opt/android-ndk" >> "$GITHUB_ENV"

      - name: Build Everything
        run: |
          ./scripts/build-all-tools.sh

      - name: Verify Repository Is Usable
        run: |
          set -euo pipefail
          ovp=$(find output/repo -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)
          idx=$(python3 -c "import json;print(json.load(open('output/repo/index.json'))['count'])")
          echo "::notice::已构建$ovp个包,index.json收录$idx个"
          [ "$ovp" -eq "$idx" ] || {
            echo "::error::index.json($idx)与实际包数($ovp)不一致"
            exit 1
          }
          ./scripts/verify-packages.sh

      - name: Prepare Publish Directory
        run: |
          chmod +x scripts/publish-repo.sh
          ./scripts/publish-repo.sh "$GITHUB_WORKSPACE/_site" \
            "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      - name: Deploy to gh-pages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          full_commit_message: 'chore: publish repository snapshot'

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0vl0ad3r-repo
          path: output/repo/
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release Assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/repo/*.pkg.tar.zst
            output/repo/index.json
            output/repo/0vl0ad3r.db.tar.zst
            output/repo/0vl0ad3r.files.tar.zst
          fail_on_unmatched_files: true
          generate_release_notes: true
