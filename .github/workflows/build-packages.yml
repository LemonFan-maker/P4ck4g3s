name: Build Packages & Publish Repository

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bootstrap/**'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/build-packages.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'bootstrap/**'
      - 'scripts/**'
      - 'patches/**'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build pacman Packages, Verify & Publish
    permissions:
      contents: write

    env:
      OVL0AD3R_DOMAIN: ${{ vars.OVL0AD3R_DOMAIN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Tools
        run: |
          sudo apt-get update
          # libarchive-dev 不能省: alpm.h 会 #include <archive.h>,
          # 只有 libarchive-tools(bsdtar 本体)不含头文件, 门禁编译会失败。
          # 注释必须留在续行之外 —— 反斜杠续行会把整个块拼成一条逻辑行,
          # 行内的 # 会把后面所有包名一起注释掉。
          sudo apt-get install -y \
            build-essential cmake ninja-build meson pkg-config \
            zstd curl ca-certificates tar xz-utils unzip \
            libarchive-tools libarchive-dev patchelf \
            autoconf automake libtool gettext libssl-dev \
            python3

      - name: Install repo-add
        run: |
          sudo apt-get install -y pacman-package-manager
          command -v repo-add
          repo-add --help > /dev/null

      - name: Install libalpm for the verification gate
        run: |
          sudo apt-get install -y libalpm-dev
          # 断言方式必须和门禁本身一致: scripts/verify-packages.sh 用
          # `cc -o ... -lalpm` 编译, 从不调用 pkg-config。
          # libalpm.pc 的 Requires.private 列出 gpgme / libcurl 等**静态链接**
          # 才需要的依赖, 本项目是动态链接根本不用它们, 所以
          # `pkg-config --exists libalpm` 即使编译完全正常也会返回失败。
          printf '#include <alpm.h>\nint main(void){return alpm_version()?0:1;}\n' \
            > /tmp/alpm-probe.c
          cc -O2 -o /tmp/alpm-probe /tmp/alpm-probe.c -lalpm || \
            { echo "::error::libalpm不可用,门禁的libalpm段将无法运行(缺libarchive-dev?)"; exit 1; }
          /tmp/alpm-probe

      - name: Setup Android NDK
        run: |
          # 钉在 r30: r26d 的 Bionic limits.h 不定义 LINE_MAX, pacman 的
          # lib/libalpm/util.c 会在 "use of undeclared identifier 'LINE_MAX'"
          # 上编译失败(已用 NDK 官方 clang + #error 探针在容器里复现)。
          # r30 是本地跑通全部 18 个包与三道门禁的那一版, CI 必须复现同一配置。
          NDK_ZIP=android-ndk-r30-linux.zip
          curl -fsSL -o "/tmp/$NDK_ZIP" \
            "https://dl.google.com/android/repository/$NDK_ZIP"
          sudo unzip -q "/tmp/$NDK_ZIP" -d /opt
          sudo mv /opt/android-ndk-r30 /opt/android-ndk
          echo "ANDROID_NDK_ROOT=/opt/android-ndk" >> "$GITHUB_ENV"

      - name: Build Everything
        run: |
          ./scripts/build-all-tools.sh

      - name: Verify Repository Is Usable
        run: |
          set -euo pipefail
          ovp=$(find output/repo -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)
          idx=$(python3 -c "import json;print(json.load(open('output/repo/index.json'))['count'])")
          echo "::notice::已构建$ovp个包,index.json收录$idx个"
          [ "$ovp" -eq "$idx" ] || {
            echo "::error::index.json($idx)与实际包数($ovp)不一致"
            exit 1
          }

      - name: Prepare Publish Directory
        run: |
          chmod +x scripts/publish-repo.sh
          ./scripts/publish-repo.sh "$GITHUB_WORKSPACE/_site" \
            "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      - name: Deploy to gh-pages
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          full_commit_message: 'chore: publish repository snapshot'

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0vl0ad3r-repo
          path: output/repo/
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release Assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/repo/*.pkg.tar.zst
            output/repo/index.json
            output/repo/0vl0ad3r.db.tar.zst
            output/repo/0vl0ad3r.files.tar.zst
          fail_on_unmatched_files: true
          generate_release_notes: true
