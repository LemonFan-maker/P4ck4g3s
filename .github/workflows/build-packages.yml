name: Build Packages & Publish Repository

on:
  push:
    branches: [ main, master ]
    paths:
      - 'bootstrap/**'
      - 'scripts/**'
      - 'patches/**'
      - 'manifest/**'
      - '.github/workflows/build-packages.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'bootstrap/**'
      - 'scripts/**'
      - 'patches/**'
      - 'manifest/**'
      - '.github/workflows/build-packages.yml'
  workflow_dispatch:
  # 每天北京时间 09:00 重编并发布。GitHub Actions 的 cron 恒为 UTC,
  # 北京 = UTC+8, 所以 09:00 对应 01:00 UTC。
  # 目的不是"有代码改动才构建",而是接住上游 tarball 漂移: ncurses / nano 这类
  # 上游会重新打包的 tarball,清单里钉死的 sha256 迟早与实际产物失配。
  schedule:
    - cron: '0 1 * * *'
concurrency:
  group: build-packages-${{ github.ref }}
  # 不能开 cancel-in-progress: run 级并发优先于 job 级, 会把正在部署的整个 run
  # 掐掉。actions/deploy-pages 走 Pages deployment API, 中断会把 github-pages
  # environment 卡在 in-progress, 之后每次部署都报 stale deployment, 只能去
  # Settings->Pages 手工删掉卡住的 deployment 恢复。构建本身代价高, 取消也省不下
  # 什么, 撞上每日 schedule 时多跑一次远比卡死划算。
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    name: Build pacman Packages, Verify & Publish
    permissions:
      contents: write

    env:
      OVL0AD3R_DOMAIN: ${{ vars.OVL0AD3R_DOMAIN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build meson pkg-config \
            zstd curl ca-certificates tar xz-utils unzip \
            libarchive-tools libarchive-dev patchelf \
            autoconf automake libtool gettext libssl-dev \
            python3
          # autopoint 必须显式装: 它是独立包, gettext 不带、autoconf 也不 Recommends,
          # 而 aria2 的 git 树没有预生成 configure, autoreconf -fi 要靠它。
          # GitHub runner 镜像恰好预装了它, 掩盖了这个依赖 —— 换 runner 或在干净的
          # ubuntu 容器里构建就会在 aria2 上炸, 所以不能靠镜像的偶然内容。
          sudo apt-get install -y autopoint
          command -v autopoint

      - name: Install repo-add
        run: |
          sudo apt-get install -y pacman-package-manager
          command -v repo-add
          repo-add --help > /dev/null

      - name: Install libalpm for the verification gate
        run: |
          sudo apt-get install -y libalpm-dev
          printf '#include <alpm.h>\nint main(void){return alpm_version()?0:1;}\n' \
            > /tmp/alpm-probe.c
          cc -O2 -o /tmp/alpm-probe /tmp/alpm-probe.c -lalpm || \
            { echo "::error::libalpm不可用,门禁的libalpm段将无法运行(缺libarchive-dev?)"; exit 1; }
          /tmp/alpm-probe

      - name: Check Manifest Matches Arch Upstream
        id: manifest_check
        # 推送/PR: 版本漂移必须硬失败(README §3.5: 清单漂移在CI构建前即失败),
        # 由人审阅后主动升级版本并提交。
        # 定时构建: 版本漂移不再拦停本次重建。上游每次发版都会让这道门失败,
        # 若在定时构建里也硬失败,整条每日重建会先死在版本门上,而它的职责是
        # 接住上游 tarball 漂移(下载时sha256失配)——那道检查在版本门之后,
        # 版本门先死就永远轮不到它。定时构建因此只在告警里留痕,继续按仓库
        # 提交的清单重建发布;版本升级仍然走人审阅。
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: |
          ./scripts/sync-archlinux.py --check

      - name: Refresh Manifest
        # 漂移时留一份"上游现在是什么版本"的人工复核材料。写到仓库外的临时
        # 路径: 发布的包必须与仓库提交的清单一一对应(README §3.5 版本单一
        # 来源),刷新结果不能流进构建。
        if: always() && steps.manifest_check.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "::warning::组件清单与Arch上游不一致;本次构建仍按仓库提交的清单发布,版本升级需人审阅后提交"
          ./scripts/sync-archlinux.py --output "$RUNNER_TEMP/components.manifest"

      - name: Upload Refreshed Manifest Diff
        if: always() && steps.manifest_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-manifest
          path: ${{ runner.temp }}/components.manifest
          retention-days: 7
          if-no-files-found: warn

      - name: Setup Android NDK
        run: |
          NDK_PIN=$(python3 scripts/manifest-query.py ndk version)
          test -n "$NDK_PIN" || { echo "::error::清单里没有ndk版本"; exit 1; }
          echo "按清单安装Android NDK $NDK_PIN"
          NDK_ZIP="android-ndk-${NDK_PIN}-linux.zip"
          curl -fsSL -o "/tmp/$NDK_ZIP" \
            "https://dl.google.com/android/repository/$NDK_ZIP"
          sudo unzip -q "/tmp/$NDK_ZIP" -d /opt
          sudo mv "/opt/android-ndk-${NDK_PIN}" /opt/android-ndk
          echo "ANDROID_NDK_ROOT=/opt/android-ndk" >> "$GITHUB_ENV"

      - name: Build Everything
        run: |
          ./scripts/build-all-tools.sh

      - name: Upload Bootstrap Seed
        # 这里产出的就是 build-all-tools.sh 末尾装配的同一份种子, 不再由
        # 单独的 bootstrap workflow 重编一遍工具链。
        uses: actions/upload-artifact@v4
        with:
          name: 0vl0ad3r-bootstrap-aarch64
          path: |
            output/bootstrap/*.tar.zst
            output/bootstrap/bin/*
            output/bootstrap/lib64/*
            output/bootstrap/etc/*
          if-no-files-found: error

      - name: Verify Repository Is Usable
        run: |
          set -euo pipefail
          ovp=$(find output/repo -maxdepth 1 -name '*.pkg.tar.zst' | wc -l)
          idx=$(python3 -c "import json;print(json.load(open('output/repo/index.json'))['count'])")
          echo "::notice::已构建$ovp个包,index.json收录$idx个"
          [ "$ovp" -eq "$idx" ] || {
            echo "::error::index.json($idx)与实际包数($ovp)不一致"
            exit 1
          }
          ./scripts/verify-packages.sh

      - name: Prepare Publish Directory
        run: |
          chmod +x scripts/publish-repo.sh
          ./scripts/publish-repo.sh "$GITHUB_WORKSPACE/_site" \
            "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"

      - name: Upload Pages Artifact
        # 部署条件必须显式排除 pull_request: PR 事件下 github.ref 是 refs/pull/N/merge,
        # 只判"不是 tag"会求值为真, 于是任意 PR 都能把未审代码发布到线上源。
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0vl0ad3r-repo
          path: output/repo/
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release Assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/repo/*.pkg.tar.zst
            output/repo/index.json
            output/repo/0vl0ad3r.db.tar.zst
            output/repo/0vl0ad3r.files.tar.zst
          fail_on_unmatched_files: true
          generate_release_notes: true

  deploy:
    needs: build
    # 同上, 且这条会真正改写线上站点。
    if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 部署必须串行: 取消上一次会留下一个已改写的发布但未激活的 Pages 构建。
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


